<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="meta-description" name="description" content="Approfondimento Bruniano.">
  <title>Articolo | Bruniano</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-v2.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="page-hero"><div class="container"><p class="eyebrow" id="post-category">BRUNIANO</p><h1 id="post-title">Articolo</h1><p id="post-excerpt"></p></div></section>
  <section class="content-section"><div class="container" style="max-width:820px"><article class="content-card"><div id="post-cover" style="display:none;margin:-30px -30px 30px;max-height:460px;overflow:hidden;border-radius:24px 24px 0 0"><img id="post-cover-img" alt="" style="width:100%;height:100%;object-fit:cover"></div><div id="post-content" style="white-space:pre-wrap;font-size:17px;line-height:1.85;color:#344054"></div><p id="post-author" style="margin-top:30px;color:#667085;font-size:13px"></p></article></div></section>
</main>
<div id="site-footer"></div>
<script src="shared.js"></script><script src="script.js"></script>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('slug');
  if (!slug) return showError();
  try {
    const response = await fetch('/api/blog?slug=' + encodeURIComponent(slug));
    const post = await response.json();
    if (!response.ok) return showError();
    document.title = `${post.title} | Bruniano`;
    document.getElementById('meta-description').setAttribute('content', post.meta_description || post.excerpt || 'Approfondimento Bruniano.');
    document.getElementById('post-category').textContent = post.category || 'APPROFONDIMENTO';
    document.getElementById('post-title').textContent = post.title;
    document.getElementById('post-excerpt').textContent = post.excerpt || '';
    document.getElementById('post-content').textContent = post.content || '';
    document.getElementById('post-author').textContent = post.author ? `A cura di ${post.author}` : '';
    if (post.cover_image_url) { const wrap=document.getElementById('post-cover'); document.getElementById('post-cover-img').src=post.cover_image_url; wrap.style.display='block'; }
  } catch { showError(); }
  function showError(){ document.getElementById('post-title').textContent='Articolo non trovato'; document.getElementById('post-content').textContent='L’articolo richiesto non è disponibile.'; }
})();
</script>
</body>
</html>
