<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team | Bruniano</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-v2.css"><style>.team-live{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.team-card{overflow:hidden;border:1px solid var(--line2);border-radius:28px;background:#fff;box-shadow:var(--shadow2)}.team-photo{height:360px;background:#eaf1fc;overflow:hidden}.team-photo img{width:100%;height:100%;object-fit:cover;display:block}.team-info{padding:28px}.team-role{font-size:10px;font-weight:800;letter-spacing:.13em;color:var(--b2);text-transform:uppercase}.team-info h2{font-size:27px;margin:9px 0 7px}.team-specialty{color:var(--muted2);margin:0 0 18px}.team-bio{color:#46546a;line-height:1.6;font-size:14px}.team-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.team-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:999px;font-size:12px;font-weight:800;text-decoration:none;border:1px solid var(--line2);color:var(--ink2);cursor:pointer;background:#fff}.team-btn.primary{background:var(--b2);border-color:var(--b2);color:#fff}.team-empty{grid-column:1/-1;padding:45px;border:1px dashed var(--line2);border-radius:25px;color:var(--muted2);text-align:center}.cv-overlay{position:fixed;inset:0;background:rgba(5,18,40,.62);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.cv-overlay.open{display:flex}.cv-modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px;padding:34px;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.25)}.cv-close{position:absolute;right:18px;top:16px;border:0;background:#eef3fa;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}.cv-modal h2{font-size:34px;margin:0 0 6px}.cv-meta{color:var(--muted2);margin-bottom:28px}.cv-section{padding:20px 0;border-top:1px solid var(--line2)}.cv-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--b2);margin:0 0 10px}.cv-section p{line-height:1.7;color:#46546a;margin:0;white-space:pre-line}@media(max-width:900px){.team-live{grid-template-columns:1fr 1fr}.team-photo{height:320px}}@media(max-width:600px){.team-live{grid-template-columns:1fr}.team-photo{height:380px}.cv-modal{padding:28px 22px}}</style></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><p class="eyebrow">IL TEAM</p><h1>Professionisti<br><em>al tuo fianco.</em></h1><p>Conosci le persone che compongono Bruniano, le loro specializzazioni e il percorso professionale di ciascuno.</p></div></section><section class="content-section"><div class="container"><div id="team-live" class="team-live"><div class="team-empty">Caricamento professionisti…</div></div></div></section></main><div id="cv-overlay" class="cv-overlay" aria-hidden="true"><article class="cv-modal"><button class="cv-close" aria-label="Chiudi">×</button><p class="eyebrow">PROFILO PROFESSIONALE</p><h2 id="cv-name"></h2><div id="cv-meta" class="cv-meta"></div><div class="cv-section"><h3>Profilo professionale</h3><p id="cv-bio"></p></div><div class="cv-section"><h3>Formazione e specializzazioni</h3><p id="cv-specialty"></p></div></article></div><div id="site-footer"></div><script src="shared.js"></script><script src="script.js"></script><script>(async()=>{const root=document.getElementById('team-live'),overlay=document.getElementById('cv-overlay'),close=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')};document.querySelector('.cv-close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const r=await fetch('/api/team',{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('API team HTTP '+r.status);const d=await r.json(),items=d.items||[];if(!items.length){root.innerHTML='<div class="team-empty">Nessun professionista pubblicato al momento.</div>';return}root.innerHTML=items.map(m=>`<article class="team-card"><div class="team-photo">${m.photo_url?`<img src="${m.photo_url}" alt="${m.name}" loading="lazy">`:'<div style="height:100%;display:grid;place-items:center;color:#56729f">Foto non disponibile</div>'}</div><div class="team-info"><div class="team-role">${m.role||'Professionista'}</div><h2>${m.name}</h2><p class="team-specialty">${m.specialty||''}</p><p class="team-bio">${m.bio||''}</p><div class="team-actions"><button class="team-btn" data-cv="${m.id}">Curriculum ↗</button><a class="team-btn primary" data-whatsapp href="#">Prenota</a></div></div></article>`).join('');items.forEach(m=>{const b=document.querySelector(`[data-cv="${m.id}"]`);if(b)b.onclick=()=>{const c=m.curriculum||{};document.getElementById('cv-name').textContent=m.name;document.getElementById('cv-meta').textContent=[m.role,m.specialty].filter(Boolean).join(' · ');document.getElementById('cv-bio').textContent=c.profile||m.bio||'Profilo in aggiornamento.';document.getElementById('cv-specialty').textContent=[c.training,c.experience,c.certifications].filter(Boolean).join('\n\n')||m.specialty||'Informazioni in aggiornamento.';overlay.classList.add('open');overlay.setAttribute('aria-hidden','false')}})}catch(e){root.innerHTML='<div class="team-empty">Il servizio Team non è momentaneamente disponibile. Riprova tra poco.</div>'}finally{clearTimeout(timeout)}})();</script></body></html>
