<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso operatori | Bruniano</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Manrope,system-ui,sans-serif;color:#10213b;background:#f5f8fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:#fff;border:1px solid #e6edf5;border-radius:24px;padding:42px;box-shadow:0 24px 70px #10213b14}.brand{text-align:center;margin-bottom:32px}.brand img{width:190px;max-width:100%;height:auto}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#145cff;margin:0 0 8px}.title{font-size:30px;line-height:1.15;margin:0 0 10px}.intro{color:#66758a;font-size:14px;line-height:1.6;margin:0 0 28px}label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}input{width:100%;height:50px;border:1px solid #d9e2ec;border-radius:12px;padding:0 15px;font:inherit;outline:none;margin-bottom:18px}input:focus{border-color:#145cff;box-shadow:0 0 0 4px #145cff14}.btn{width:100%;height:52px;border:0;border-radius:12px;background:#145cff;color:#fff;font:700 15px Manrope;cursor:pointer}.error{display:none;margin:16px 0 0;padding:12px;border-radius:10px;background:#fff0f0;color:#b42318;font-size:13px}.back{display:block;text-align:center;margin-top:24px;color:#66758a;text-decoration:none;font-size:13px}@media(max-width:520px){.login{padding:30px 24px;border-radius:20px}.title{font-size:26px}}
</style>
</head>
<body>
<main class="login">
<div class="brand"><img src="../assets/logo-bruniano.svg" alt="Bruniano"></div>
<p class="eyebrow">Area riservata</p>
<h1 class="title">Accesso operatori</h1>
<p class="intro">Accedi al pannello di gestione di Bruniano.</p>
<form id="loginForm" novalidate>
<label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="btn" type="submit">Accedi</button>
<div id="error" class="error" role="alert">Username o password non corretti.</div>
</form>
<a class="back" href="../index.html">← Torna al sito</a>
</main>
<script>
const form=document.getElementById('loginForm');const error=document.getElementById('error');
form.addEventListener('submit',e=>{e.preventDefault();error.style.display='none';const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;
// Credenziali dimostrative: sostituire con autenticazione server-side prima della pubblicazione.
if(u==='admin'&&p==='123456'){sessionStorage.setItem('brunianoAdminDemo','1');window.location.href='index.html';}else{error.style.display='block';}});
</script>
</body></html>
