<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bruniano Gestionale · Develop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">B</div><div><strong>bruniano</strong><span>GESTIONALE</span></div></div>
      <div class="env-badge">DEVELOP · AREA TEST</div>
      <nav class="nav" aria-label="Navigazione gestionale">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span>Dashboard</button>
        <button class="nav-item" data-view="agenda"><span>◫</span>Agenda</button>
        <button class="nav-item" data-view="appointments"><span>◷</span>Appuntamenti</button>
        <button class="nav-item" data-view="patients"><span>○</span>Pazienti</button>
        <button class="nav-item" data-view="professionals"><span>✦</span>Professionisti</button>
        <button class="nav-item" data-view="treatments"><span>◇</span>Trattamenti</button>
        <button class="nav-item" data-view="promotions"><span>%</span>Promozioni</button>
        <div class="nav-separator"></div><p class="nav-label">CONTENUTI</p>
        <button class="nav-item" data-view="content"><span>▦</span>Sito e contenuti</button>
        <button class="nav-item" data-view="reviews"><span>★</span>Recensioni</button>
        <div class="nav-separator"></div><p class="nav-label">AMMINISTRAZIONE</p>
        <button class="nav-item" data-view="users"><span>◎</span>Utenti e ruoli</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>Impostazioni</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span><div><strong>Sistema operativo</strong><small>Ambiente di sviluppo</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="mobile-menu" id="mobile-menu" aria-label="Apri menu">☰</button><div class="topbar-title"><span id="breadcrumb">Dashboard</span><span class="slash">/</span><strong id="page-title">Panoramica</strong></div><div class="topbar-actions"><button class="icon-button" aria-label="Notifiche">♢<i></i></button><div class="user-menu"><div class="avatar">G</div><div><strong>Gestore</strong><small>Amministratore</small></div></div></div></header>
      <section class="content" id="app-content"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal" aria-hidden="true"><div class="modal"></div></div>
  <script src="app-v2.js"></script>
</body>
</html>
