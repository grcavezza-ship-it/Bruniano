name: Fix Studio hero media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-studio-hero-media.yml'
      - 'studio.html'
      - 'shared.js'
      - '.studio-hero-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix studio hero loading
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('studio.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1600&q=85" alt="Ambiente moderno di un centro sanitario" loading="eager"'
          new = 'alt="Ambiente moderno del Centro Medico Specialistico Bruniano" loading="eager" data-managed-studio-hero'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('shared.js')
          s = p.read_text(encoding='utf-8')
          needle = "if(document.body.classList.contains('studio-page')){"
          start = s.index(needle)
          brace = s.index('{', start)
          depth = 1
          i = brace + 1
          in_str = None
          esc = False
          while i < len(s) and depth:
              c = s[i]
              if in_str:
                  if esc: esc = False
                  elif c == '\\\\': esc = True
                  elif c == in_str: in_str = None
              else:
                  if c in "'\\\"`": in_str = c
                  elif c == '{': depth += 1
                  elif c == '}': depth -= 1
              i += 1

          replacement = """if(document.body.classList.contains('studio-page')){
    try{
      const response=await fetch('/api/gallery',{cache:'no-store'});
      if(!response.ok)return;
      const data=await response.json();
      const items=Array.isArray(data.items)?data.items:[];
      const heroItem=items.find(media=>Number(media.studio_slot)===1);
      const heroBox=document.querySelector('.studio-hero-media');
      const heroImage=heroBox?.querySelector('img[data-managed-studio-hero]');
      if(heroItem && heroBox){
        const isVideo=String(heroItem.media_type||'').startsWith('video');
        const media=document.createElement(isVideo?'video':'img');
        media.src=heroItem.media_url;
        media.alt=heroItem.alt_text||heroItem.title||'Ambiente del Centro Medico Specialistico Bruniano';
        media.loading='eager';
        media.decoding='async';
        if(isVideo){media.muted=true;media.loop=true;media.playsInline=true;media.autoplay=true;media.preload='metadata';}
        media.className=heroImage?.className||'';
        if(heroImage)heroImage.replaceWith(media); else heroBox.prepend(media);
      }else if(heroImage){
        heroImage.remove();
      }
      [2,3,4].forEach(slot=>{
        const item=items.find(media=>Number(media.studio_slot)===slot);
        if(!item)return;
        const tile=document.querySelector(`.studio-grid .studio-tile:nth-child(${slot})`);
        if(!tile)return;
        const old=tile.querySelector('img,video');
        const isVideo=String(item.media_type||'').startsWith('video');
        const media=document.createElement(isVideo?'video':'img');
        media.src=item.media_url;
        media.alt=item.alt_text||item.title||'Immagine dello studio Bruniano';
        media.loading='lazy';
        if(isVideo){media.muted=true;media.loop=true;media.playsInline=true;media.autoplay=true;media.preload='metadata';}
        media.className=old?.className||'';
        if(old)old.replaceWith(media); else tile.prepend(media);
      });
    }catch{}
  }"""
          s = s[:start] + replacement + s[i:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.html shared.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix caricamento hero Lo studio"
          git push
