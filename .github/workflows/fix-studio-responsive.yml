name: Fix Studio responsive mosaic
on:
  push:
    paths:
      - .github/workflows/fix-studio-responsive.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add responsive gap-free rules
        run: |
          cat >> site-v2.css <<'EOF'

/* Studio mosaic responsive: never leave the last photo alone or create a blank cell */
@media(max-width:950px){
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(7){grid-column:5/7!important;grid-row:3/4!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(6){grid-column:3/5!important;grid-row:3/4!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(5){grid-column:1/3!important;grid-row:3/4!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(4){grid-column:5/7!important;grid-row:2/3!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(3){grid-column:3/5!important;grid-row:2/3!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(2){grid-column:5/7!important;grid-row:1/2!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(1){grid-column:1/5!important;grid-row:1/2!important}
}
@media(max-width:650px){
  .studio-page .studio-grid[data-count="7"]{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-auto-rows:170px!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(1){grid-column:1/3!important;grid-row:1/3!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(2){grid-column:1/2!important;grid-row:3/4!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(3){grid-column:2/3!important;grid-row:3/4!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(4){grid-column:1/2!important;grid-row:4/5!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(5){grid-column:2/3!important;grid-row:4/5!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(6){grid-column:1/2!important;grid-row:5/6!important}
  .studio-page .studio-grid[data-count="7"] .studio-tile:nth-child(7){grid-column:2/3!important;grid-row:5/6!important}
}
EOF
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v2.css
          git diff --cached --quiet && exit 0
          git commit -m 'Keep Studio mosaic gap-free on responsive layouts'
          git push
