name: Set Studio story image to original Cloudinary asset
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/set-studio-story-original.yml
      - trigger-studio-image.txt
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Studio story image
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('studio.html')
          s = p.read_text(encoding='utf-8')
          new_src = 'https://res.cloudinary.com/pomzhih4/image/upload/v1789633911/bruniano/studio/studio-medico-paziente.png'
          pattern = r'(<div class="story-media"><img\s+src=")[^"]+("[^>]*>\s*</div>)'
          s2, n = re.subn(pattern, lambda m: m.group(1) + new_src + m.group(2), s, count=1)
          if n != 1:
              raise SystemExit('Studio story image block not found; no changes made.')
          p.write_text(s2, encoding='utf-8')
          PY
          git diff -- studio.html
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.html
          git diff --cached --quiet && exit 0
          git commit -m "Use original Cloudinary Studio image"
          git push
