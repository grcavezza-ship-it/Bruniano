name: Fix Tecar mirrored source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Tecar video orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-media.css')
          s = p.read_text()
          old = '/* Keep the Tecar video in its original, non-mirrored orientation. */\n.machine-video video{transform:none!important;}'
          new = '/* Correct the Tecar source, which is delivered mirrored. */\n.machine-video video{transform:scaleX(-1)!important;}'
          if old not in s:
              raise SystemExit('Expected Tecar orientation rule not found; aborting without changes.')
          p.write_text(s.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-media.css
          git commit -m 'fix: unmirror Tecar source video'
          git push
