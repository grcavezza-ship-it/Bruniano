name: Temporary studio gallery repair

on:
  push:
    branches: [staging/seo-completa-20260917]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair seven-item gallery pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('shared.js')
          text = path.read_text(encoding='utf-8')
          old = "7:[[7,5],[3,3,3,3],[6,3,3]]"
          new = "7:[[7,5],[4,3],[6,4]]"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repaired gallery pattern
        shell: bash
        run: |
          if git diff --quiet -- shared.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js
          git commit -m "Fix studio gallery seven-item pattern"
          git push
