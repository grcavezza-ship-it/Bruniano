name: Use original Studio image without transformations
on:
  push:
    paths:
      - .github/workflows/fix-studio-image-direct.yml
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace transformed Studio image URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studio.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://res.cloudinary.com/pomzhih4/image/upload/e_gen_restore/c_scale,w_1200/f_auto/q_auto/v1789593082/bruniano/studio/studio-medico-paziente.webp'
          new = 'https://res.cloudinary.com/pomzhih4/image/upload/v1789633911/bruniano/studio/studio-medico-paziente.png'
          if old not in s:
              raise SystemExit('Expected transformed Studio image URL not found; refusing to change anything.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studio.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use original Studio image directly'
          git push
