name: SEO canonical normalize

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize public HTML canonicals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          origin = 'https://www.centromedicobruniano.it'
          files = [p for p in Path('.').glob('*.html') if p.name != '404.html']
          changed = []

          for p in files:
              s = p.read_text(encoding='utf-8')
              original = s

              # Keep the canonical domain consistent everywhere in static HTML.
              s = s.replace('https://centromedicobruniano.it', origin)

              # Static pages get an explicit self-canonical so crawlers do not have to execute JS.
              if p.name != 'articolo.html':
                  canonical = origin + ('/' if p.name == 'index.html' else '/' + p.name)
                  tag = f'<link rel="canonical" href="{canonical}">' 
                  s = re.sub(r'\s*<link\s+rel=["\']canonical["\'][^>]*>', '', s, count=1, flags=re.I)
                  marker = re.search(r'(<meta\s+name=["\']viewport["\'][^>]*>)', s, re.I)
                  if marker:
                      s = s[:marker.end()] + '\n  ' + tag + s[marker.end():]
                  elif '<head>' in s:
                      s = s.replace('<head>', '<head>\n  ' + tag, 1)

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit SEO-only changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SEO: add static self-canonicals"
          git push
