name: Fix Home Footer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[footer-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Home footer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s
          # Replace any hard-coded public footer with the shared placeholder.
          s = re.sub(r'<footer\s+class="footer"\b[\s\S]*?</footer>', '<div id="site-footer"></div>', s, count=1)
          # Load the shared layout script exactly once on the Home page.
          if 'src="shared.js"' not in s and "src='shared.js'" not in s:
              s = s.replace('</body>', '  <script src="shared.js"></script>\n</body>')
          if s != original:
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-home-footer.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Home shared footer [footer-fix]"
          # Remove this one-shot workflow after the fix.
          git rm .github/workflows/fix-home-footer.yml
          git commit -m "Remove one-shot footer fixer [footer-fix]"
          git push
