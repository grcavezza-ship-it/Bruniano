name: Fix Home Hero Image
on:
  push:
    paths:
      - .github/workflows/fix-home-hero-image.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace old hero image with current Studio image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://fisiomedilab.com/wp-content/uploads/2024/05/poliambulatorio-fisiomedilab.jpg'
          new = 'https://res.cloudinary.com/pomzhih4/image/upload/v1788910715/bruniano/bswrkbsah42oyavuewc5.png'
          if old not in s:
              raise SystemExit('Old hero URL not found; stop without changing the site.')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Replace old Home hero image'
          git push
