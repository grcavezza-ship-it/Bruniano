name: Fix Tecar crop only
on:
  push:
    paths:
      - .github/workflows/fix-tecar-crop.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Tecar view to the right half
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-media.css')
          s = p.read_text()
          old = '.machine-card:nth-child(2) .machine-video video{transform:translateX(-50%)!important}'
          new = '.machine-card:nth-child(1) .machine-video video{transform:translateX(-50%)!important}'
          if old not in s:
              raise SystemExit('Expected Laser crop rule not found; aborting.')
          if '.machine-card:nth-child(1) .machine-video video' in s:
              raise SystemExit('Tecar crop rule already present; aborting.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add home-media.css
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: shift Tecar video to visible half'
          git push
