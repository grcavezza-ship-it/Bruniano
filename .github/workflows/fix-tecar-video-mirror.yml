name: Fix Tecar video orientation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mirrored Tecar video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-media.css')
          s = p.read_text()
          rule = '\n/* Fix Tecar video horizontal orientation. */\n.machine-video video{transform:scaleX(-1);}\n'
          if 'transform:scaleX(-1)' not in s:
              p.write_text(s.rstrip() + rule)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-media.css
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: restore correct Tecar video orientation'
          git push
