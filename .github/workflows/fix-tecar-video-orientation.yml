name: Fix Tecar video orientation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Tecar video orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('home-media.css')
          s = p.read_text()
          import re
          s = re.sub(r'\n/\* Fix Tecar video horizontal orientation\. \*/\n\.machine-video video\{transform:scaleX\(-1\);\}\n?', '\n', s)
          rule = '\n/* Keep the Tecar video in its original, non-mirrored orientation. */\n.machine-video video{transform:none!important;}\n'
          if 'Keep the Tecar video in its original, non-mirrored orientation.' not in s:
              s = s.rstrip() + rule
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-media.css
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: restore Tecar video orientation'
          git push
