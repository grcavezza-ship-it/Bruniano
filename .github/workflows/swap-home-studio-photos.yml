name: Swap home studio photos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fixed home gallery photos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              'https://app.talentclue.com/system/files/sites/default/files/public/talentclue-public/tc_images/b54f6c1b309f555c20004e16dd424648.png': 'https://res.cloudinary.com/pomzhih4/image/upload/v1788910715/bruniano/bswrkbsah42oyavuewc5.png',
              'https://www.rehabilitacie-senec.sk/images/galeria/CG9A1648.jpg': 'https://res.cloudinary.com/pomzhih4/image/upload/v1788910740/bruniano/c9is2xzipjfybqhdxdtu.png',
              'https://mugisalud.com/wp-content/uploads/2025/01/FISIOTERAPIA-EN-BILBAO.png': 'https://res.cloudinary.com/pomzhih4/image/upload/v1788910829/bruniano/diwdl3xpg0zvj1lxwbax.png',
              'https://emedicitalia.it/cdn/shop/products/tecar_85b9e80b-c59a-4ac4-95d6-6edc9c03d0e8.png?v=1714041447&amp;width=1445': 'https://res.cloudinary.com/pomzhih4/image/upload/v1788910798/bruniano/txnfzftydmnffiandpn1.png',
          }
          found = [old for old in replacements if old in s]
          if not found:
              print('All target home gallery URLs are already replaced. Nothing to do.')
              raise SystemExit(0)
          for old in found:
              s = s.replace(old, replacements[old])
          p.write_text(s)
          PY
      - name: Commit and push when changed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: use uploaded studio photos in home gallery'
          git push