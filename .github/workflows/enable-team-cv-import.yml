name: Enable Team CV import

on:
  push:
    branches: [main]
    paths:
      - 'enable-team-cv-import.trigger'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Team CV importer
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="admin.js"></script><script src="team.js"></script><script src="users.js"></script>'
          new = '<script src="admin.js"></script><script src="team.js"></script><script src="team-cv-import.js?v=20260909"></script><script src="users.js"></script>'
          if 'team-cv-import.js' in s:
              print('Team CV importer already enabled')
          elif old not in s:
              raise SystemExit('Expected script block not found; aborting without changes.')
          else:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          git diff --check
          grep -F 'team-cv-import.js?v=20260909' admin/index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git commit -m 'feat: enable Team curriculum importer'
          git push
