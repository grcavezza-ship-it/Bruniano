name: Update Team Empty State

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update team empty state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('team.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.team-empty{grid-column:1/-1;padding:56px 30px;border:1px dashed var(--line2);border-radius:26px;text-align:center;color:var(--muted2);background:#fbfcfe}.team-empty strong{display:block;color:var(--ink2);font-size:18px;margin-bottom:6px}.team-empty span{font-size:13px}'
          new_css = '.team-empty{grid-column:1/-1;padding:70px 44px;border:1px solid var(--line2);border-radius:28px;text-align:center;color:var(--muted2);background:#fbfcfe;box-shadow:0 12px 42px rgba(19,58,120,.05)}.team-empty .team-empty-kicker{display:block;font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--b2);margin-bottom:13px}.team-empty strong{display:block;color:var(--ink2);font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.035em;margin-bottom:14px}.team-empty p{max-width:720px;margin:0 auto;color:#526175;line-height:1.75;font-size:15px}.team-empty .team-empty-note{display:block;margin-top:10px;color:var(--muted2);font-size:13px;line-height:1.6}.team-empty .team-empty-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}'
          s = s.replace(old_css, new_css)
          s = s.replace('.team-empty span{font-size:13px}', '')
          empty_html = '<div class="team-empty"><span class="team-empty-kicker">IL NOSTRO TEAM</span><strong>Un team multidisciplinare,<br><em>al tuo fianco.</em></strong><p>Stiamo completando la presentazione dei nostri specialisti. I profili saranno disponibili a breve.</p><span class="team-empty-note">Per informazioni sugli specialisti e sugli ambulatori disponibili, contatta il Centro.</span><div class="team-empty-actions"><a class="button button-primary" href="contatti.html">Contatta il Centro</a><a class="button button-ghost" data-whatsapp href="#">Prenota su WhatsApp</a></div></div>'
          s = s.replace('<div id="team-live" class="team-grid"><div class="team-empty"><strong>Stiamo caricando il Team.</strong><span>Un momento.</span></div></div>', '<div id="team-live" class="team-grid">' + empty_html + '</div>')
          s = s.replace("root.innerHTML='<div class=\"team-empty\"><strong>Nessun professionista pubblicato al momento.</strong><span>Il Team sarà visibile qui non appena verrà pubblicato dal pannello Operatori.</span></div>';return;", "root.innerHTML=" + repr(empty_html) + ";return;")
          s = s.replace("root.innerHTML='<div class=\"team-empty\"><strong>Il servizio Team non è momentaneamente disponibile.</strong><span>Riprova tra poco.</span></div>';console.error(e)", "root.innerHTML=" + repr(empty_html) + ";console.error(e)")
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team.html
          git commit -m 'Aggiorna messaggio pubblico Team vuoto'
          git rm .github/workflows/update-team-empty.yml
          git commit -m 'Rimuovi workflow temporaneo Team'
          git push
