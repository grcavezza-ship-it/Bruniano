name: Fix Studio demo placeholders

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove demo gallery images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studio.html')
          s = p.read_text()
          old_css = '.studio-grid{visibility:hidden;display:grid;'
          if old_css in s:
              s = s.replace(old_css, '.studio-grid{display:grid;', 1)
          start = s.find('<div class="studio-grid">')
          end_marker = '</div></div></section>\n<section class="studio-story"'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Studio gallery block not found')
          replacement = '''<div class="studio-grid">
          <div class="studio-tile large"></div>
          <div class="studio-tile"></div>
          <div class="studio-tile"></div>
          <div class="studio-tile wide"></div>'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Studio demo gallery images"
          git push
