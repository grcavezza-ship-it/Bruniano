name: Patch Studio Gallery Rows
on:
  push:
    paths:
      - .github/workflows/patch-studio-rows.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # shared.js: render complete rows so there can never be orphan tiles or blank grid cells.
          p = Path('shared.js')
          s = p.read_text()
          start = s.index('  function setupStudioGallery() {')
          end = s.index('  function setupHomePromotions() {', start)
          new_fn = r'''  function setupStudioGallery() {
    if (!document.body.classList.contains('studio-page')) return;
    const grid = document.querySelector('.studio-grid');
    const hero = document.querySelector('.studio-hero-media img');
    if (!grid) return;
    fetch('/api/gallery?admin=0', { cache: 'no-store' }).then((r) => r.ok ? r.json() : Promise.reject(new Error('gallery'))).then((data) => {
      const items = (data.items || []).filter((x) => x.media_url).slice(0, 12);
      if (!items.length) return;
      const images = items.filter((x) => String(x.media_type).startsWith('image'));
      if (hero && images[0]) {
        hero.src = images[0].media_url;
        hero.alt = images[0].alt_text || images[0].title || 'Ambiente Bruniano';
      }
      const count = Math.min(items.length, 12);
      grid.dataset.count = String(count);

      // Row definitions: each row always totals 12 columns, so no empty cells are possible.
      const patterns = {
        1: [[12]],
        2: [[8,4]],
        3: [[7,5],[12]],
        4: [[7,5],[5,7]],
        5: [[7,5],[4,4,4]],
        6: [[7,5],[4,4,4]],
        7: [[7,5],[3,3,3,3],[6,3,3]],
        8: [[7,5],[3,3,3,3],[6,6]],
        9: [[7,5],[3,3,3,3],[4,4,4]],
        10:[[7,5],[3,3,3,3],[3,3,3,3]],
        11:[[7,5],[3,3,3,3],[3,3,2,2,2]],
        12:[[7,5],[3,3,3,3],[2,2,2,2,2,2]]
      };
      const heights = { 1: 'tall', 2: 'tall', 3: 'tall', 4: 'tall', 5: 'medium', 6: 'medium', 7: 'medium', 8: 'medium', 9: 'medium', 10: 'medium', 11: 'medium', 12: 'medium' };
      const rows = patterns[count] || [[12]];
      let index = 0;
      grid.innerHTML = rows.map((spans, rowIndex) => {
        const rowClass = rowIndex === 0 ? 'tall' : 'medium';
        const tiles = spans.map((span) => {
          const m = items[index++];
          const media = String(m.media_type).startsWith('video')
            ? `<video src="${m.media_url}" autoplay muted loop playsinline preload="metadata" aria-label="${m.alt_text || m.title || 'Video Bruniano'}"></video>`
            : `<img src="${m.media_url}" alt="${m.alt_text || m.title || 'Ambiente Bruniano'}" loading="lazy">`;
          return `<div class="studio-tile" style="--tile-span:${span}">${media}<div class="tile-copy"><small>${m.title || m.alt_text || 'BRUNIANO'}</small></div></div>`;
        }).join('');
        return `<div class="studio-row ${rowClass}">${tiles}</div>`;
      }).join('');

      grid.querySelectorAll('img,video').forEach((el) => { el.style.width = '100%'; el.style.height = '100%'; el.style.objectFit = 'cover'; el.style.display = 'block'; });
      grid.classList.add('is-ready');
    }).catch(() => {});
  }
  setupStudioGallery();

'''
          s = s[:start] + new_fn + s[end:]
          p.write_text(s)

          # studio.html: replace the old CSS layout rules with flex rows. Each row is packed exactly.
          p = Path('studio.html')
          s = p.read_text()
          start = s.index('.studio-grid{')
          end = s.index('.studio-tile{position:relative', start)
          new_css = '.studio-grid{display:flex;flex-direction:column;gap:16px}.studio-row{display:flex;gap:16px;width:100%;min-height:320px}.studio-row.tall{min-height:430px}.studio-row.medium{min-height:300px}.studio-row .studio-tile{flex:var(--tile-span,1) 1 0;min-width:0;min-height:0}'
          s = s[:start] + new_css + s[end:]
          s = s.replace('.studio-tile.large{grid-row:span 2}.studio-tile.wide{grid-column:2/4}', '.studio-tile.large,.studio-tile.wide{grid-row:auto;grid-column:auto}')
          s = s.replace('@media(max-width:950px){.studio-hero-grid,.studio-story-grid,.experience-grid{grid-template-columns:1fr}.studio-grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:150px}.studio-tile{grid-column:span 3;grid-row:span 2}.studio-grid .studio-tile:nth-child(1){grid-column:span 3;grid-row:span 3}.tech-strip{grid-template-columns:1fr 1fr}.story-media,.story-media img{min-height:360px}}', '@media(max-width:950px){.studio-hero-grid,.studio-story-grid,.experience-grid{grid-template-columns:1fr}.studio-row{min-height:260px}.studio-row.tall{min-height:360px}.tech-strip{grid-template-columns:1fr 1fr}.story-media,.story-media img{min-height:360px}}')
          s = s.replace('@media(max-width:650px){.studio-hero{padding:76px 0 58px}.studio-hero h1{font-size:52px}.studio-lead{font-size:17px}.studio-hero-media,.studio-hero-media img{min-height:315px}.studio-gallery,.studio-story,.studio-tech,.studio-experience{padding:72px 0}.studio-grid{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:220px}.studio-grid .studio-tile,.studio-grid[data-count] .studio-tile{grid-column:auto !important;grid-row:auto !important}.tech-strip,.story-points,.experience-list{grid-template-columns:1fr}.studio-cta{padding:72px 0}.studio-cta-inner{padding:34px 25px;display:block}.studio-cta .button{margin-top:24px;width:100%}}', '@media(max-width:650px){.studio-hero{padding:76px 0 58px}.studio-hero h1{font-size:52px}.studio-lead{font-size:17px}.studio-hero-media,.studio-hero-media img{min-height:315px}.studio-gallery,.studio-story,.studio-tech,.studio-experience{padding:72px 0}.studio-row{flex-direction:column;min-height:0!important}.studio-row .studio-tile{flex:0 0 220px!important;width:100%}.tech-strip,.story-points,.experience-list{grid-template-columns:1fr}.studio-cta{padding:72px 0}.studio-cta-inner{padding:34px 25px;display:block}.studio-cta .button{margin-top:24px;width:100%}}')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared.js studio.html
          git diff --cached --quiet && exit 0
          git commit -m 'Pack Studio gallery into gap-free rows'
          git push
