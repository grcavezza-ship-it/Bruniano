name: Patch gap-free Studio gallery
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch gallery renderer and CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shared.js')
          s = p.read_text()
          start = s.index('  function setupStudioGallery() {')
          end = s.index('  function setupHomePromotions() {', start)
          new_fn = r'''  function setupStudioGallery() {
    if (!document.body.classList.contains('studio-page')) return;
    const grid = document.querySelector('.studio-grid');
    const hero = document.querySelector('.studio-hero-media img');
    if (!grid) return;
    fetch('/api/gallery?admin=0', { cache: 'no-store' }).then((r) => r.ok ? r.json() : Promise.reject(new Error('gallery'))).then((data) => {
      const items = (data.items || []).filter((x) => x.media_url).slice(0, 12);
      if (!items.length) return;
      const images = items.filter((x) => String(x.media_type).startsWith('image'));
      if (hero && images[0]) {
        hero.src = images[0].media_url;
        hero.alt = images[0].alt_text || images[0].title || 'Ambiente Bruniano';
      }
      const count = Math.min(items.length, 12);
      grid.dataset.count = String(count);
      const patterns = {
        1:[[12]],2:[[8,4]],3:[[7,5]],4:[[7,5],[5,7]],5:[[7,5],[4,4,4]],6:[[7,5],[4,4,4]],7:[[7,5],[3,3,3,3],[6,3,3]],8:[[7,5],[3,3,3,3],[6,6]],9:[[7,5],[3,3,3,3],[4,4,4]],10:[[7,5],[3,3,3,3],[3,3,3,3]],11:[[7,5],[3,3,3,3],[3,3,2,2,2]],12:[[7,5],[3,3,3,3],[2,2,2,2,2,2]]
      };
      const rows = patterns[count] || [[12]];
      let index = 0;
      grid.innerHTML = rows.map((spans, rowIndex) => {
        const rowClass = rowIndex === 0 ? 'tall' : 'medium';
        const tiles = spans.map((span) => {
          const m = items[index++];
          const media = String(m.media_type).startsWith('video')
            ? `<video src="${m.media_url}" autoplay muted loop playsinline preload="metadata" aria-label="${m.alt_text || m.title || 'Video Bruniano'}"></video>`
            : `<img src="${m.media_url}" alt="${m.alt_text || m.title || 'Ambiente Bruniano'}" loading="lazy">`;
          return `<div class="studio-tile" style="--tile-span:${span}">${media}<div class="tile-copy"><small>${m.title || m.alt_text || 'BRUNIANO'}</small></div></div>`;
        }).join('');
        return `<div class="studio-row ${rowClass}">${tiles}</div>`;
      }).join('');
      grid.querySelectorAll('img,video').forEach((el) => { el.style.width='100%'; el.style.height='100%'; el.style.objectFit='cover'; el.style.display='block'; });
      grid.classList.add('is-ready');
    }).catch(() => {});
  }
  setupStudioGallery();

'''
          p.write_text(s[:start] + new_fn + s[end:])
          p = Path('studio.html')
          s = p.read_text()
          start = s.index('.studio-grid{')
          end = s.index('.studio-tile{position:relative', start)
          new_css = '.studio-grid{display:flex;flex-direction:column;gap:16px}.studio-row{display:flex;gap:16px;width:100%;min-height:300px}.studio-row.tall{min-height:430px}.studio-row.medium{min-height:300px}.studio-row .studio-tile{flex:var(--tile-span,1) 1 0;min-width:0;min-height:0}'
          p.write_text(s[:start] + new_css + s[end:])
          PY
      - name: Commit patch to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared.js studio.html
          git diff --cached --quiet && exit 0
          git commit -m 'Pack Studio gallery into gap-free rows'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
