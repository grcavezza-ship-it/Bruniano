name: Final Studio hero fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-studio-hero-fix.yml
      - studio.html
      - shared.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Studio hero marker and story image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('studio.html')
          s = p.read_text(encoding='utf-8')

          old_marker = '<div data-managed-studio-hero aria-hidden="true"></div>'
          new_marker = '<img alt="" loading="eager" data-managed-studio-hero>'
          if old_marker in s:
              s = s.replace(old_marker, new_marker, 1)
          elif '<img alt="" loading="eager" data-managed-studio-hero>' not in s and 'data-managed-studio-hero' not in s:
              raise SystemExit('Studio hero marker not found; aborting to avoid damaging studio.html')

          old_story = 'https://res.cloudinary.com/pomzhih4/image/upload/e_gen_restore/c_scale,w_1200/f_auto/q_auto/v1789593082/bruniano/studio/studio-medico-paziente.webp'
          new_story = 'https://res.cloudinary.com/pomzhih4/image/upload/v1789633911/bruniano/studio/studio-medico-paziente.png'
          if old_story in s:
              s = s.replace(old_story, new_story, 1)
          elif new_story not in s:
              raise SystemExit('Expected Studio story image URL not found; refusing to change anything.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use original Studio story image"
          git push
