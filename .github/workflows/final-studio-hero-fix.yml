name: Final Studio hero fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-studio-hero-fix.yml
      - studio.html
      - shared.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy hero image
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('studio.html')
          s = p.read_text(encoding='utf-8')
          old = 'src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1600&q=85" alt="Ambiente moderno di un centro sanitario" loading="eager"'
          new = 'alt="Ambiente moderno del Centro Medico Specialistico Bruniano" loading="eager" data-managed-studio-hero'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif 'data-managed-studio-hero' not in s:
              raise SystemExit('Legacy Studio hero source not found; aborting to avoid damaging studio.html')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove legacy Studio hero image"
          git push
