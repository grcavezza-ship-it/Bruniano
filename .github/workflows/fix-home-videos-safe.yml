name: Fix Home video framing safely
on:
  push:
    paths:
      - .github/workflows/fix-home-videos-safe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Home video presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          old_link = '<link rel="stylesheet" href="home-media.css">'
          new_link = '<link rel="stylesheet" href="home-media.css?v=6">'
          if old_link not in s and new_link not in s:
              raise SystemExit('Expected home-media stylesheet link not found; aborting.')
          s = s.replace(old_link, new_link, 1)

          # Explicitly prevent any stale/cached CSS from mirroring either video.
          s, n = re.subn(r'(<video autoplay muted loop playsinline preload="metadata")', r'\1 style="transform:none!important"', s, count=2)
          if n != 2:
              raise SystemExit(f'Expected exactly 2 Home technology videos, found {n}; aborting.')
          p.write_text(s)

          p = Path('home-media.css')
          s = p.read_text()
          old_a = '.machine-photo,.machine-video{position:relative;min-height:290px;overflow:hidden}'
          new_a = '.machine-photo,.machine-video{position:relative;overflow:hidden}'
          old_b = '.machine-video video{display:block;width:100%;height:100%;min-height:290px;object-fit:cover}'
          new_b = '.machine-video{aspect-ratio:16/9}\n.machine-video video{display:block;width:100%;height:100%;min-height:0;object-fit:cover;object-position:center;transform:none!important}'
          if old_a not in s or old_b not in s:
              raise SystemExit('Expected original Home video rules not found; aborting.')
          s = s.replace(old_a, new_a, 1).replace(old_b, new_b, 1)
          p.write_text(s)
          PY
      - name: Validate scope
        run: |
          grep -n 'home-media.css?v=6' index.html
          grep -n 'style="transform:none!important"' index.html | wc -l
          grep -n 'machine-video{aspect-ratio:16/9}' home-media.css
          grep -n 'object-fit:cover;object-position:center;transform:none!important' home-media.css
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html home-media.css
          git diff --cached --check
          git commit -m 'fix: restore Home video framing without touching sources'
          git push
