name: Clean Lo Studio tile copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate public tile text
        shell: python
        run: |
          from pathlib import Path
          p = Path('shared.js')
          s = p.read_text(encoding='utf-8')
          old = '''return `<div class="${classes}">${media}<div class="tile-copy"><small>${String(m.title || 'BRUNIANO').toUpperCase()}</small><strong>${m.alt_text || 'Scopri gli ambienti del Centro Medico Specialistico Bruniano.'}</strong></div></div>`;'''
          new = '''return `<div class="${classes}">${media}<div class="tile-copy"><small>${m.title || m.alt_text || 'BRUNIANO'}</small></div></div>`;'''
          if old not in s:
              raise SystemExit('Target renderer non trovato: nessuna modifica eseguita.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js
          git diff --cached --quiet && exit 0
          git commit -m "Pulizia testo duplicato nella galleria Lo Studio"
          git push
